<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda SSPV - Gestión de Productos</title>
    <link rel="stylesheet" href="css/gestion.css">
</head>
<body>
    <header>
        <div class="marca">Tienda SSPV</div>
        <h1>Gestión de Productos</h1>
        <nav class="nav-menu">
            <a href="usuarios.html">Usuarios</a>
            <a href="clientes.html">Clientes</a>
            <a href="proveedores.html">Proveedores</a>
            <a href="productos.html" class="activo">Productos</a>
            <a href="#" onclick="alert('Módulo de Ventas disponible en el Sprint 4'); return false;">Ventas</a>
            <a href="#" onclick="alert('Módulo de Reportes disponible en el Sprint 5'); return false;">Reportes</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <h2>Carga de Productos desde Archivo CSV</h2>
            
            <input type="file" id="p-archivo" accept=".csv" style="display: none;">

            <label for="p-nombre-archivo">Nombre del Archivo</label>
            <div class="upload-box">
                <input type="text" id="p-nombre-archivo" placeholder="Seleccione un archivo CSV..." readonly>
                <button type="button" id="boton-examinar" class="btn-examinar">Examinar</button>
            </div>

            <div class="botones">
                <button type="button" id="boton-cargar" class="accion btn-crear">Cargar</button>
            </div>

            <div id="p-mensaje" class="mensaje" hidden></div>
        </div>

        <div class="card">
            <div class="tabla-header">
                <h2>Productos Registrados</h2>
                <button type="button" id="boton-refrescar" class="btn-refrescar">Refrescar</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Código Producto</th>
                        <th>Nombre Producto</th>
                        <th>NIT Proveedor</th>
                        <th>Precio Compra</th>
                        <th>IVA Compra</th>
                        <th>Precio Venta</th>
                    </tr>
                </thead>
                <tbody id="p-tabla"></tbody>
            </table>
        </div>
    </main>

    <script src="js/productos.js"></script>
</body>
</html>
