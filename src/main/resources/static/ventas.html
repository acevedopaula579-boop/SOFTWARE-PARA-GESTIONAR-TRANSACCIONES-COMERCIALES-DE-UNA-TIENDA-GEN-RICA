<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda SSPV - Gestión de Ventas</title>
    <link rel="stylesheet" href="css/gestion.css">
    <link rel="stylesheet" href="css/modulos.css">
</head>
<body>
    <header>
        <div class="marca">TIENDA SSPV</div>
        <h1>Gestión de Ventas</h1>
        <nav class="nav-menu">
            <a href="usuarios.html">Usuarios</a>
            <a href="clientes.html">Clientes</a>
            <a href="proveedores.html">Proveedores</a>
            <a href="productos.html">Productos</a>
            <a href="ventas.html" class="activo">Ventas</a>
            <a href="reportes.html">Reportes</a>
        </nav>
    </header>

    <main>
        <!-- Card 1: Datos del Cliente -->
        <div class="card">
            <h2>Datos del Cliente</h2>
            <form id="form-cliente" onsubmit="event.preventDefault();">
                <div style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <label for="cedulaCliente">Cédula Cliente</label>
                        <input type="number" id="cedulaCliente" placeholder="Ingrese cédula">
                    </div>
                    <div>
                        <button type="button" class="accion btn-consultar" onclick="buscarCliente()">Consultar</button>
                    </div>
                    <div style="flex: 2; min-width: 250px;">
                        <label for="nombreCliente">Nombre Cliente</label>
                        <input type="text" id="nombreCliente" placeholder="Nombre del cliente" readonly>
                    </div>
                </div>
            </form>
        </div>

        <!-- Card 2: Detalle de la Venta -->
        <div class="card">
            <h2>Detalle de la Venta</h2>
            <table>
                <thead>
                    <tr>
                        <th style="width: 20%;">CÓD. PRODUCTO</th>
                        <th style="width: 12%;">ACCIÓN</th>
                        <th style="width: 33%;">NOMBRE PRODUCTO</th>
                        <th style="width: 10%;">CANTIDAD</th>
                        <th style="width: 12.5%;">PRECIO UNIT.</th>
                        <th style="width: 12.5%;">SUBTOTAL</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="number" id="codigoProducto1" placeholder="Código"></td>
                        <td><button type="button" class="accion btn-consultar" style="padding: 6px 12px;" onclick="buscarProducto(1)">Buscar</button></td>
                        <td><input type="text" id="nombreProducto1" readonly></td>
                        <td><input type="number" id="cantidadProducto1" value="0" min="0" oninput="calcularFila(1)"></td>
                        <td><input type="number" id="precioProducto1" readonly></td>
                        <td>
                            <input type="number" id="subtotalProducto1" readonly>
                            <input type="hidden" id="ivaProducto1" value="19">
                        </td>
                    </tr>
                    <tr>
                        <td><input type="number" id="codigoProducto2" placeholder="Código"></td>
                        <td><button type="button" class="accion btn-consultar" style="padding: 6px 12px;" onclick="buscarProducto(2)">Buscar</button></td>
                        <td><input type="text" id="nombreProducto2" readonly></td>
                        <td><input type="number" id="cantidadProducto2" value="0" min="0" oninput="calcularFila(2)"></td>
                        <td><input type="number" id="precioProducto2" readonly></td>
                        <td>
                            <input type="number" id="subtotalProducto2" readonly>
                            <input type="hidden" id="ivaProducto2" value="19">
                        </td>
                    </tr>
                    <tr>
                        <td><input type="number" id="codigoProducto3" placeholder="Código"></td>
                        <td><button type="button" class="accion btn-consultar" style="padding: 6px 12px;" onclick="buscarProducto(3)">Buscar</button></td>
                        <td><input type="text" id="nombreProducto3" readonly></td>
                        <td><input type="number" id="cantidadProducto3" value="0" min="0" oninput="calcularFila(3)"></td>
                        <td><input type="number" id="precioProducto3" readonly></td>
                        <td>
                            <input type="number" id="subtotalProducto3" readonly>
                            <input type="hidden" id="ivaProducto3" value="19">
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Resumen de Totales Horizontal -->
            <div style="display: flex; gap: 15px; justify-content: flex-end; align-items: flex-end; margin-top: 20px; flex-wrap: wrap;">
                <div>
                    <label for="totalVenta">Valor Venta</label>
                    <input type="text" id="totalVenta" readonly placeholder="$ 0">
                </div>
                <div>
                    <label for="totalIva">Total IVA (19%)</label>
                    <input type="text" id="totalIva" readonly placeholder="$ 0">
                </div>
                <div>
                    <label for="totalConIva">Total con IVA</label>
                    <input type="text" id="totalConIva" readonly placeholder="$ 0" style="font-weight: bold;">
                </div>
                <div>
                    <button type="button" class="accion btn-crear" onclick="confirmarVenta()">Confirmar Venta</button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/ventas.js"></script>
</body>
</html>
